import groovy.json.JsonSlurper
import java.util.zip.ZipFile
import java.util.zip.ZipInputStream

plugins {
    id 'base'
}

gradle.projectsEvaluated {
    def implementations = subprojects
        .findAll { project -> project.extensions.extraProperties.has('minecraft_version') }
        .sort { left, right -> left.name <=> right.name }
    def nestedJson = implementations.collect { project ->
        "{\"file\": \"META-INF/jars/${project.name}.jar\"}"
    }.join(',\n    ')

    def universalJarTask = tasks.register('universalJar', Jar) {
        group = 'build'
        description = 'Builds the single universal Redy Crosshair release JAR.'
        archiveFileName = "redy-crosshair-${rootProject.mod_version}.jar"
        destinationDirectory = layout.buildDirectory.dir('release')
        inputs.property 'loader_version', rootProject.loader_version

        from('src/universal/resources') {
            filesMatching('fabric.mod.json') {
                expand(
                    version: rootProject.mod_version,
                    loader_version: rootProject.loader_version,
                    nested_jars: nestedJson
                )
            }
        }
        from('LICENSE') {
            rename { 'LICENSE_redy-crosshair' }
        }

        implementations.each { project ->
            def finalJarTask = project.tasks.named(project.legacy_mappings ? 'remapJar' : 'jar')
            dependsOn finalJarTask
            into('META-INF/jars') {
                from(finalJarTask.flatMap { it.archiveFile }) {
                    rename { "${project.name}.jar" }
                }
            }
        }
    }

    def verifyUniversalJarTask = tasks.register('verifyUniversalJar') {
        group = 'verification'
        description = 'Checks the universal release JAR and every nested implementation.'
        dependsOn universalJarTask
        inputs.file(universalJarTask.flatMap { it.archiveFile })

        doLast {
            def releaseJar = universalJarTask.get().archiveFile.get().asFile
            def expectedNestedJars = implementations.collectEntries { project ->
                [("META-INF/jars/${project.name}.jar"): project]
            }

            new ZipFile(releaseJar).withCloseable { releaseZip ->
                def rootMetadataEntry = releaseZip.getEntry('fabric.mod.json')
                if (rootMetadataEntry == null) {
                    throw new GradleException('Universal JAR does not contain fabric.mod.json.')
                }

                def rootMetadata = new JsonSlurper().parse(releaseZip.getInputStream(rootMetadataEntry))
                if (rootMetadata.id != 'redycrosshair') {
                    throw new GradleException("Universal metadata has unexpected mod id '${rootMetadata.id}'.")
                }
                if (rootMetadata.version != rootProject.mod_version.toString()) {
                    throw new GradleException("Universal metadata version '${rootMetadata.version}' does not match '${rootProject.mod_version}'.")
                }
                if (rootMetadata.depends.fabricloader != ">=${rootProject.loader_version}") {
                    throw new GradleException("Universal metadata Loader dependency '${rootMetadata.depends.fabricloader}' does not match '>=${rootProject.loader_version}'.")
                }

                def listedNestedJars = rootMetadata.jars.collect { nestedJar -> nestedJar.file }
                if (listedNestedJars != expectedNestedJars.keySet().toList()) {
                    throw new GradleException("Universal metadata lists ${listedNestedJars}, expected ${expectedNestedJars.keySet().toList()}.")
                }

                expectedNestedJars.each { nestedPath, project ->
                    def nestedJarEntry = releaseZip.getEntry(nestedPath)
                    if (nestedJarEntry == null) {
                        throw new GradleException("Universal JAR does not contain ${nestedPath}.")
                    }

                    def nestedMetadata
                    new ZipInputStream(releaseZip.getInputStream(nestedJarEntry)).withCloseable { nestedZip ->
                        for (def nestedEntry = nestedZip.nextEntry; nestedEntry != null; nestedEntry = nestedZip.nextEntry) {
                            if (nestedEntry.name == 'fabric.mod.json') {
                                nestedMetadata = new JsonSlurper().parse(nestedZip)
                                break
                            }
                        }
                    }

                    if (nestedMetadata == null) {
                        throw new GradleException("${nestedPath} does not contain fabric.mod.json.")
                    }
                    if (nestedMetadata.id != 'redycrosshair_impl') {
                        throw new GradleException("${nestedPath} has unexpected mod id '${nestedMetadata.id}'.")
                    }
                    if (nestedMetadata.version != project.impl_version.toString()) {
                        throw new GradleException("${nestedPath} version '${nestedMetadata.version}' does not match '${project.impl_version}'.")
                    }
                    if (nestedMetadata.depends.minecraft != project.minecraft_dependency.toString()) {
                        throw new GradleException("${nestedPath} Minecraft dependency '${nestedMetadata.depends.minecraft}' does not match '${project.minecraft_dependency}'.")
                    }
                    if (nestedMetadata.depends['java'] != ">=${project.java_version}") {
                        throw new GradleException("${nestedPath} Java dependency '${nestedMetadata.depends['java']}' does not match '>=${project.java_version}'.")
                    }
                    if (nestedMetadata.depends.fabricloader != ">=${rootProject.loader_version}") {
                        throw new GradleException("${nestedPath} Loader dependency '${nestedMetadata.depends.fabricloader}' does not match '>=${rootProject.loader_version}'.")
                    }
                }
            }

            logger.lifecycle("Verified ${releaseJar.name}: ${implementations.size()} compatible Minecraft implementations.")
        }
    }

    tasks.named('check') {
        dependsOn verifyUniversalJarTask
    }
}
