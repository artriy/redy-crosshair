# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25.0.3+9'
          distribution: 'temurin'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build and verify universal release
        run: ./gradlew build
      - name: install smoke-test display
        run: sudo apt-get update && sudo apt-get install --no-install-recommends --yes xvfb libgl1-mesa-dri
      - name: smoke-test Minecraft boundaries
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew -p smoke :mc1_21_1:runClient --no-daemon
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew -p smoke :mc26_2:runClient --no-daemon
          xvfb-run -a -s "-screen 0 1280x720x24" ./gradlew -p smoke :mc26_3:runClient --no-daemon
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/release/*.jar
