version = rootProject.mod_version
group = rootProject.maven_group

base {
    archivesName = "redy-crosshair-${project.minecraft_version}"
}

loom {
    splitEnvironmentSourceSets()
    mods {
        "redycrosshair" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

sourceSets {
    main {
        java.setSrcDirs([])
        resources.setSrcDirs([rootProject.file('src/main/resources')])
    }
    client {
        java.setSrcDirs(project.client_source_dirs.collect { rootProject.file(it) })
        resources.setSrcDirs([rootProject.file('src/client/resources')])
    }
}

repositories {
    mavenCentral()
    maven {
        name = 'Modrinth'
        url = 'https://api.modrinth.com/maven'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    clientImplementation "net.fabricmc:fabric-loader:${rootProject.loader_version}"
    clientCompileOnly "net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7"
    if (project.legacy_mappings) {
        modCompileOnly "maven.modrinth:modmenu:${project.modmenu_version}"
    } else {
        clientCompileOnly "maven.modrinth:modmenu:${project.modmenu_version}"
    }
    if (project.legacy_mappings) {
        mappings loom.officialMojangMappings()
    }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'minecraft_dependency', project.minecraft_dependency
    inputs.property 'java_version', project.java_version
    inputs.property 'impl_version', project.impl_version

    filesMatching(['fabric.mod.json', 'redycrosshair.client.mixins.json']) {
        expand(
            version: project.version,
            impl_version: project.impl_version,
            minecraft_dependency: project.minecraft_dependency,
            java_version: project.java_version
        )
    }
}

tasks.named('processClientResources', ProcessResources) {
    inputs.property 'java_version', project.java_version

    filesMatching('redycrosshair.client.mixins.json') {
        expand(java_version: project.java_version)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = project.java_version as int
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.toVersion(project.java_version)
    targetCompatibility = JavaVersion.toVersion(project.java_version)
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "LICENSE_redy-crosshair" }
    }
}
